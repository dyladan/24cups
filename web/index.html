<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4eee3" />
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.ts).
      ;(function () {
        var p = null
        try { p = localStorage.getItem('advent-theme') } catch (e) {}
        var t = p === 'light' || p === 'dark' ? p : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#141110' : '#f4eee3')
      })()
    </script>
    <meta name="description" content="A community log for rating the coffees in this year's advent calendar." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Onyx Advent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
