# Onyx Advent behind a Cloudflare Tunnel.
#
#   cp .env.example .env    # then paste your tunnel token into .env
#   docker compose up -d --build
#
# Visitors connect to Cloudflare over HTTPS (Cloudflare's edge certificate);
# cloudflared carries traffic to the app over an outbound, encrypted tunnel.
# The app has no published ports. Its "outbound" network lets it call
# Cloudflare Siteverify (sign-up bot check) and the host's OTel collector.

name: onyx-advent # project name: volumes are onyx-advent_*, regardless of directory

services:
  app:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev} # e.g. VERSION=$(git rev-parse --short HEAD)
    image: onyx-advent:latest
    restart: unless-stopped
    environment:
      # Real visitor IPs for rate limiting. Safe only because the app is
      # reachable solely through cloudflared (no published ports).
      CLIENT_IP_HEADER: CF-Connecting-IP
      SECURE_COOKIES: "true"
      CALENDAR_YEAR: ${CALENDAR_YEAR:-2026}
      # Bot check on sign-up. The site key is public; the secret and the
      # allowed hostnames come from .env. With no secret, sign-up has no check.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-0x4AAAAAAGRV0UPs2N-iBLmI}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}
      # OpenTelemetry (standard OTEL_* variables). Off unless an endpoint is
      # set in .env, e.g. the host's collector at http://host.docker.internal:4318.
      OTEL_SERVICE_NAME: onyx-advent
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: delta # Dynatrace needs delta
      OTEL_METRIC_EXPORT_INTERVAL: "60000"
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment.name=production}
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
    volumes:
      - advent-data:/data
    depends_on:
      # On a fresh volume, pull the latest backup from R2 before the app
      # creates an empty database.
      litestream-restore:
        condition: service_completed_successfully
    networks:
      - internal
      - outbound # Cloudflare Siteverify + the host's OTel collector
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp # SQLite temp space for large sorts
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m

  # One-shot: restore from R2 if the database is missing and a backup exists;
  # otherwise (database present, or first deploy with no backup) do nothing.
  litestream-restore:
    image: litestream/litestream:${LITESTREAM_VERSION:-0.5.18}
    command: restore -if-db-not-exists -if-replica-exists /data/advent.db
    user: "65532:65532" # same user as the app, so restored files stay writable
    environment: &litestream-env
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?set R2_ACCOUNT_ID in .env}
      R2_BUCKET: ${R2_BUCKET:?set R2_BUCKET in .env}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID in .env}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY in .env}
    volumes: &litestream-volumes
      - advent-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    networks: [outbound]
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Continuous replication of every committed change to R2.
  litestream:
    image: litestream/litestream:${LITESTREAM_VERSION:-0.5.18}
    command: replicate
    user: "65532:65532"
    environment: *litestream-env
    volumes: *litestream-volumes
    depends_on:
      app:
        condition: service_healthy # the database exists by then
    networks: [outbound]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Set in .env (never committed). See README → Deploying.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal # reaches the app as http://app:8080
      - egress # outbound to Cloudflare
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  advent-data:

networks:
  internal:
    internal: true # no route to the internet
  egress:
  # Outbound access for the app. Required with Turnstile: without it the app
  # can't reach challenges.cloudflare.com and every sign-up is rejected (the
  # app logs "turnstile check failed" at startup). Also reaches the host's
  # OTel collector via host.docker.internal.
  outbound:
